
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b16">
<title>ZAIN SENTINEL X | DASHBOARD</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#090b16;
 --sidebar:#070d1d;
 --panel:#151c2c;
 --border:#293e5b;
 --blue:#398cff;
 --cyan:#37c8df;
 --purple:#9174ff;
 --green:#39d6ac;
 --text:#e8edf8;
 --muted:#8996ad;
}

body{
 margin:0;
 min-height:100vh;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
}

.app{
 display:flex;
 min-height:100vh;
}

/* SIDEBAR */

.sidebar{
 width:235px;
 min-width:235px;
 background:var(--sidebar);
 border-right:1px solid #18243b;
 display:flex;
 flex-direction:column;
 padding:20px 13px;
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
 padding:5px 7px 30px;
 border-bottom:1px solid #18243b;
}

.brand-icon{
 width:38px;
 height:38px;
 display:grid;
 place-items:center;
 border-radius:10px;
 background:#142b4c;
 color:#55bdff;
 font-size:22px;
}

.brand-name{
 font-size:18px;
 font-weight:bold;
}

.brand-name span{
 color:#55bdff;
}

.menu-title{
 color:#72829c;
 font-size:10px;
 letter-spacing:2px;
 margin:27px 10px 12px;
}

.nav{
 display:block;
 text-decoration:none;
 color:#a9b6ca;
 padding:13px 12px;
 border-radius:7px;
 margin:4px 0;
 font-size:13px;
 border:1px solid transparent;
 transition:.2s;
}

.nav:hover,.nav.active{
 color:#75bfff;
 background:#102442;
 border-color:#244d78;
}

.nav span{
 display:inline-block;
 width:28px;
 font-size:16px;
}

.sidebar-bottom{
 margin-top:auto;
 border-top:1px solid #18243b;
 padding-top:16px;
}

.user{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px 5px;
}

.avatar{
 width:34px;
 height:34px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:#1d4c82;
 color:white;
 font-weight:bold;
}

.user-info strong{
 font-size:12px;
 display:block;
}

.user-info small{
 color:#8291a9;
 font-size:10px;
}

/* MAIN */

.content{
 flex:1;
 min-width:0;
 padding:30px 30px;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:32px;
}

.page-title{
 font-size:22px;
 font-weight:bold;
}

.page-subtitle{
 color:var(--muted);
 font-size:12px;
 margin-top:8px;
}

.settings{
 border:1px solid #2b3b57;
 color:#b5c5dc;
 background:#111827;
 padding:10px 15px;
 border-radius:7px;
 font-size:12px;
}

/* DASHBOARD */

.dashboard{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:18px;
 margin-top:65px;
}

.panel{
 min-height:125px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:10px;
 padding:20px;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.panel-title{
 text-align:center;
 font-size:13px;
 font-weight:bold;
 color:#dce5f4;
}

.panel-icon{
 margin-right:7px;
 color:var(--purple);
 font-size:17px;
}

/* QUICK ACTIONS */

.quick{
 grid-column:1/-1;
 min-height:155px;
 text-align:center;
 padding:22px;
}

.quick-title{
 font-size:13px;
 font-weight:bold;
 margin-bottom:25px;
}

.quick-title span{
 color:var(--purple);
 margin-right:7px;
 font-size:18px;
}

.actions{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
}

.action{
 min-width:125px;
 min-height:75px;
 padding:13px 15px;
 border-radius:8px;
 background:#0d1424;
 border:1px solid #39345f;
 text-decoration:none;
 color:#dce6f7;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:9px;
 transition:.2s;
}

.action:hover{
 background:#19243a;
 border-color:#7770bc;
}

.action-icon{
 color:var(--green);
 font-size:21px;
}

.action-name{
 font-size:11px;
 font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:700px){

 .sidebar{
  width:75px;
  min-width:75px;
  padding:15px 8px;
 }

 .brand{
  justify-content:center;
  padding:5px 0 22px;
 }

 .brand-icon{
  width:42px;
  height:42px;
 }

 .brand-name,
 .menu-title,
 .nav-text,
 .user-info{
  display:none;
 }

 .nav{
  text-align:center;
  padding:14px 5px;
 }

 .nav span{
  width:auto;
  font-size:20px;
 }

 .user{
  justify-content:center;
 }

 .content{
  padding:23px 15px;
 }

 .page-title{
  font-size:18px;
 }

 .dashboard{
  gap:12px;
  margin-top:40px;
 }

 .panel{
  min-height:115px;
  padding:12px 6px;
 }

 .panel-title{
  font-size:11px;
 }

 .actions{
  gap:8px;
 }

 .action{
  min-width:105px;
  flex:1 1 40%;
 }

 .quick{
  padding:18px 10px;
 }
}

@media(max-width:380px){
 .content{
  padding:18px 10px;
 }

 .panel{
  min-height:105px;
 }

 .panel-title{
  font-size:10px;
 }
}
</style>
</head>
